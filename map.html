<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hearts of History: Театр Военных Действий</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0e1112;
            color: #d1c2a5;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* 1. ТОП-БАР */
        .game-header {
            height: 50px;
            background: linear-gradient(to bottom, #222729, #181b1d);
            border-bottom: 3px solid #3a4145;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .country-info-block {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .country-flag-badge {
            width: 35px;
            height: 22px;
            border: 1px solid #e9c46a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            background: #111415;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.8);
        }

        .country-name {
            font-size: 16px;
            font-weight: bold;
            color: #e9c46a;
            letter-spacing: 1px;
        }

        .game-stats {
            display: flex;
            gap: 20px;
        }

        .stat-badge {
            background: #111415;
            border: 1px solid #4f585d;
            padding: 4px 12px;
            font-size: 13px;
            color: #fff;
        }

        .exit-btn {
            background: #721c24;
            color: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 5px 15px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 11px;
        }

        .exit-btn:hover {
            background: #af232f;
            color: #fff;
        }

        /* 2. ИГРОВАЯ ЗОНА */
        .main-theater {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* ЛЕВАЯ ПАНЕЛЬ */
        .control-sidebar {
            width: 300px;
            background: #15191b;
            border-right: 2px solid #3a4145;
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
            z-index: 5;
        }

        .panel-title {
            font-size: 14px;
            color: #e9c46a;
            text-transform: uppercase;
            border-bottom: 1px solid #3a4145;
            padding-bottom: 5px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .inspector-card {
            background: #1b2022;
            border: 1px solid #4f585d;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 12px;
        }

        .tool-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .map-action-btn {
            background: #24292c;
            border: 1px solid #4f585d;
            color: #d1c2a5;
            padding: 10px;
            cursor: pointer;
            text-align: left;
            font-size: 12px;
            font-weight: bold;
        }

        .map-action-btn:hover {
            border-color: #e9c46a;
            color: #fff;
            background: #2e3539;
        }

        /* ЦЕНТР: ОКНО ПРОСМОТРА КАРТЫ */
        .map-viewport {
            flex: 1;
            background: #0f1214;
            position: relative;
            overflow: hidden;
            cursor: grab;
        }

        .map-viewport:active {
            cursor: grabbing;
        }

        /* ИСПРАВЛЕНО: Для корректного зума в точку курсора origin должен быть в левом верхнем углу */
        .infinite-wrapper {
            display: flex;
            position: absolute;
            transform-origin: 0 0;

            /* Подсказки для браузера, чтобы он не мылил SVG при масштабировании */
            transform: translateZ(0);
            /* Включает GPU-ускорение */

            /* Отключаем размытие текстур */
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }

        .map-clone {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .map-clone svg {
            width: auto;
            height: 85vh;
            display: block;

            /* Это заставляет браузер всегда рендерить геометрию */
            shape-rendering: crispEdges;
            /* Важно для масштабирования контуров */
            vector-effect: non-scaling-stroke;
        }

        /* СТИЛИ ДЛЯ ПРОВИНЦИЙ */
        /* СТИЛИ ДЛЯ ПРОВИНЦИЙ */
        .province {
            stroke: #121516;
            stroke-width: 1.5;
            cursor: pointer;
            /* Убираем will-change отсюда, чтобы не перегружать память */
            transition: fill 0.1s ease, stroke 0.1s ease;
        }

        .province:hover {
            /* Вместо тяжелого filter используем простое высветление границ и легкую прозрачность */
            fill-opacity: 0.85;
            stroke: #e9c46a;
            stroke-width: 2.5;
        }

        /* ПРАВАЯ ПАНЕЛЬ */
        .log-sidebar {
            width: 250px;
            background: #15191b;
            border-left: 2px solid #3a4145;
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
            z-index: 5;
        }

        .ticker-box {
            flex: 1;
            background: #0b0d0e;
            border: 1px solid #3a4145;
            padding: 10px;
            font-size: 11px;
            color: #8da1aa;
            overflow-y: auto;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <!-- 1. ВЕРХНЯЯ ПАНЕЛЬ -->
    <div class="game-header">
        <div class="country-info-block">
            <div id="player-flag" class="country-flag-badge">🏳️</div>
            <div id="player-country" class="country-name">ЗАГРУЗКА ДАННЫХ...</div>
        </div>
        <div class="game-stats">
            <div class="stat-badge">📅 1 Сентября 1939</div>
            <div class="stat-badge" style="color: #4caf50;" id="player-status-badge">⚡ Режим: Игрок</div>
            <div class="stat-badge" id="ruler-badge">Глава: Штаб</div>
        </div>
        <button class="exit-btn" onclick="exitToMenu()">В меню</button>
    </div>

    <!-- 2. ИГРОВОЙ ТЕАТР -->
    <div class="main-theater">

        <!-- ЛЕВАЯ ПАНЕЛЬ -->
        <div class="control-sidebar">
            <div class="panel-title">Данные Региона</div>
            <div class="inspector-card">
                <div id="selected-region-name" style="font-weight: bold; color: #fff; margin-bottom: 5px;">Регион не
                    выбран</div>
                <div id="selected-region-status">Кликните по провинции на карте для разведки.</div>
            </div>

            <div class="panel-title">Приказы Штаба</div>
            <div class="tool-box">
                <button class="map-action-btn" onclick="sendTroops()">⚔️ Направить дивизии</button>
                <button class="map-action-btn" onclick="buildForts()">🛡️ Построить укрепления</button>
                <button class="map-action-btn" onclick="industrialize()">🏭 Развернуть заводы</button>
            </div>
        </div>

        <!-- ЦЕНТР: ПЕРЕМЕЩАЕМАЯ КАРТА -->
        <div class="map-viewport" id="viewport">
            <div class="infinite-wrapper" id="panzoom-target">
                <!-- Основная карта -->
                <div class="map-clone" id="primary-map-container">
                    <p style="padding: 40px; text-align: center; width: 100%;">Загрузка тактической карты...</p>
                </div>
            </div>
        </div>

        <!-- ПРАВАЯ ПАНЕЛЬ -->
        <div class="log-sidebar">
            <div class="panel-title">Хроника Событий</div>
            <div class="ticker-box" id="log-ticker">
                [00:00] Фронтовой штаб развернут.<br>
            </div>
        </div>
    </div>

    <!-- Основная логика инициализации игры и кастомного контроллера -->
    <script>
        // Сырые файлы Gist
        const MAP_URL = 'https://gist.githubusercontent.com/whtine/75e8ff05c613e288f6d20017b2c5b035/raw/d8c957fc238b5e66e88b88c5004ea57d5d984938/gistfile1.txt';
        const DB_URL = 'https://gist.githubusercontent.com/whtine/3995ac119298d0b2fa1c9907f50e853b/raw/f2544d05cc756a3e93a1c898ec2f7f2d49c41331/gistfile1.txt';

        async function initGame() {
            try {
                // 1. Получаем данные из localStorage (которые были сохранены при выборе)
                const myCountry = localStorage.getItem('selectedHoiCountry') || 'Аргентина';
                const myColor = localStorage.getItem('selectedHoiColor') || '#58a6ff';
                const myFlagUrl = localStorage.getItem('selectedHoiFlagUrl') || 'https://flagcdn.com/w80/un.png';

                // Обновляем название страны
                document.getElementById('player-country').innerText = myCountry;

                // Обновляем флаг в шапке
                const flagElement = document.getElementById('player-flag');
                flagElement.style.borderColor = myColor;
                // Вставляем изображение флага, используя сохраненный URL
                flagElement.innerHTML = `<img src="${myFlagUrl}" style="width:100%; height:100%; object-fit:cover;">`;

                // 2. Загрузка базы данных провинций
                const cacheBuster = `?t=${new Date().getTime()}`;
                const [dbResponse, svgResponse] = await Promise.all([
                    fetch(DB_URL + cacheBuster),
                    fetch(MAP_URL + cacheBuster)
                ]);

                const dbData = await dbResponse.json();
                const svgText = await svgResponse.text();

                document.getElementById('primary-map-container').innerHTML = svgText;

                const provinceLookup = {};
                dbData.forEach(item => { if (item.id) provinceLookup[item.id] = item; });

                const provinces = document.querySelectorAll('.province');
                provinces.forEach(prov => {
                    const data = provinceLookup[prov.id];
                    if (data) {
                        prov.style.fill = data.color || '#cccccc';
                        prov.onclick = (e) => {
                            e.stopPropagation();
                            document.getElementById('selected-region-name').innerText = data.name || "Провинция";

                            // Здесь мы можем использовать тот же механизм для отображения флага владельца региона
                            // Если у тебя в базе провинций есть тег страны, можно сделать функцию поиска флага по имени
                            document.getElementById('selected-region-status').innerHTML = `Владелец: <b>${data.country || 'Нейтралы'}</b>`;

                            const ticker = document.getElementById('log-ticker');
                            ticker.innerHTML += `[Разведка] ${data.name} под контролем ${data.country}.<br>`;
                            ticker.scrollTop = ticker.scrollHeight;
                        };
                    }
                });

                setupNativeMapControl();
            } catch (err) {
                console.error("Ошибка инициализации:", err);
            }
        }

        // ИСПРАВЛЕНО: Нативный, стабильный контроллер перемещения и зума
        function setupNativeMapControl() {
            const viewport = document.getElementById('viewport');
            const target = document.getElementById('panzoom-target');

            let scale = 1;
            // Изначально центрируем карту в окне просмотра
            let x = (viewport.clientWidth - target.clientWidth) / 2 || 0;
            let y = (viewport.clientHeight - target.clientHeight) / 2 || 0;

            let isDragging = false;
            let startX, startY;

            function updateTransform() {
                target.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
            }

            // Устанавливаем базовую позицию
            updateTransform();

            // 1. МЕХАНИКА ПЕРЕТАСКИВАНИЯ (DRAG & DROP)
            viewport.addEventListener('mousedown', (e) => {
                // Игнорируем клики по кнопкам интерфейса, если они попадут в область
                if (e.target.closest('.control-sidebar') || e.target.closest('.log-sidebar')) return;
                isDragging = true;
                startX = e.clientX - x;
                startY = e.clientY - y;
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                x = e.clientX - startX;
                y = e.clientY - startY;
                updateTransform();
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
            });

            // 2. СТРАТЕГИЧЕСКИЙ ЗУМ В ТОЧКУ КУРСОРA МЫШИ
            viewport.addEventListener('wheel', (e) => {
                e.preventDefault();

                const zoomStep = 0.15;
                const rect = viewport.getBoundingClientRect();

                // Координаты мыши относительно вьюпорта карты
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                // Запоминаем точку на карте, куда указывает мышь до изменения зума
                const mapX = (mouseX - x) / scale;
                const mapY = (mouseY - y) / scale;

                // Рассчитываем новый масштаб
                if (e.deltaY < 0) {
                    if (scale < 10) scale *= (1 + zoomStep); // Приближение (макс х10)
                } else {
                    if (scale > 0.15) scale /= (1 + zoomStep); // Отдаление (мин х0.15)
                }

                // Корректируем смещение (x, y), чтобы зафиксировать точку под курсором
                x = mouseX - mapX * scale;
                y = mouseY - mapY * scale;

                updateTransform();
            }, { passive: false });
        }

        function exitToMenu() {
            window.location.href = 'game.html';
        }

        function sendTroops() { alert("Приказ: Дивизии выдвигаются в указанный сектор!"); }
        function buildForts() { alert("Приказ: Начато возведение линии укреплений."); }
        function industrialize() { alert("Приказ: Выделены средства на постройку фабричных complexes."); }

        window.onload = initGame;
    </script>
</body>

</html>
