<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hearts of History: Театр Военных Действий</title>
    <!-- Подключаем библиотеку для плавного перемещения и зума карты -->
    <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/panzoom/4.5.1/panzoom.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0e1112;
            color: #d1c2a5;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* 1. ТОП-БАР */
        .game-header {
            height: 50px;
            background: linear-gradient(to bottom, #222729, #181b1d);
            border-bottom: 3px solid #3a4145;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .country-info-block {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .country-flag-badge {
            width: 35px;
            height: 22px;
            border: 1px solid #e9c46a;
        }

        .country-name {
            font-size: 16px;
            font-weight: bold;
            color: #e9c46a;
            letter-spacing: 1px;
        }

        .game-stats {
            display: flex;
            gap: 20px;
        }

        .stat-badge {
            background: #111415;
            border: 1px solid #4f585d;
            padding: 4px 12px;
            font-size: 13px;
            color: #fff;
        }

        .exit-btn {
            background: #721c24;
            color: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 5px 15px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 11px;
        }

        .exit-btn:hover {
            background: #af232f;
            color: #fff;
        }

        /* 2. ИГРОВАЯ ЗОНА */
        .main-theater {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* ЛЕВАЯ ПАНЕЛЬ */
        .control-sidebar {
            width: 300px;
            background: #15191b;
            border-right: 2px solid #3a4145;
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
            z-index: 5;
        }

        .panel-title {
            font-size: 14px;
            color: #e9c46a;
            text-transform: uppercase;
            border-bottom: 1px solid #3a4145;
            padding-bottom: 5px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .inspector-card {
            background: #1b2022;
            border: 1px solid #4f585d;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 12px;
        }

        .tool-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .map-action-btn {
            background: #24292c;
            border: 1px solid #4f585d;
            color: #d1c2a5;
            padding: 10px;
            cursor: pointer;
            text-align: left;
            font-size: 12px;
            font-weight: bold;
        }

        .map-action-btn:hover {
            border-color: #e9c46a;
            color: #fff;
            background: #2e3539;
        }

        /* ЦЕНТР: ОКНО ПРОСМОТРА КАРТЫ (ДРАГ-ЗЕНА) */
        .map-viewport {
            flex: 1;
            background: #0f1214;
            /* Цвет мирового океана */
            position: relative;
            overflow: hidden;
            cursor: grab;
        }

        .map-viewport:active {
            cursor: grabbing;
        }

        /* Обертка для реализации бесконечного горизонтального цикла */
        .infinite-wrapper {
            display: flex;
            position: absolute;
            height: 100%;
            will-change: transform;
        }

        .map-clone {
            height: 100%;
            display: flex;
            align-items: center;
        }

        #world-svg-map {
            width: auto;
            height: 95vh;
            /* Карта растягивается по высоте экрана */
            display: block;
        }

        /* СТИЛИ ДЛЯ ТВОИХ ПРОВИНЦИЙ */
        .province {
            stroke: #121516;
            stroke-width: 1.5;
            cursor: pointer;
            transition: filter 0.12s ease-in-out;
        }

        .province:hover {
            filter: brightness(1.3) contrast(1.1);
            stroke: #e9c46a;
            stroke-width: 2.5;
        }

        /* ПРАВАЯ ПАНЕЛЬ */
        .log-sidebar {
            width: 250px;
            background: #15191b;
            border-left: 2px solid #3a4145;
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
            z-index: 5;
        }

        .ticker-box {
            flex: 1;
            background: #0b0d0e;
            border: 1px solid #3a4145;
            padding: 10px;
            font-size: 11px;
            color: #8da1aa;
            overflow-y: auto;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <!-- 1. ВЕРХНЯЯ ПАНЕЛЬ -->
    <div class="game-header">
        <div class="country-info-block">
            <div id="player-flag" class="country-flag-badge"></div>
            <div id="player-country" class="country-name">ЗАГРУЗКА ДАННЫХ...</div>
        </div>
        <div class="game-stats">
            <div class="stat-badge">📅 1 Сентября 1939</div>
            <div class="stat-badge" style="color: #4caf50;" id="player-status-badge">⚡ Режим: Игрок</div>
            <div class="stat-badge" id="ruler-badge">Глава: Штаб</div>
        </div>
        <button class="exit-btn" onclick="exitToMenu()">В меню</button>
    </div>

    <!-- 2. ИГРОВОЙ ТЕАТР -->
    <div class="main-theater">

        <!-- ЛЕВАЯ ПАНЕЛЬ -->
        <div class="control-sidebar">
            <div class="panel-title">Данные Региона</div>
            <div class="inspector-card">
                <div id="selected-region-name" style="font-weight: bold; color: #fff; margin-bottom: 5px;">Регион не
                    выбран</div>
                <div id="selected-region-status">Кликните по провинции на карте для разведки.</div>
            </div>

            <div class="panel-title">Приказы Штаба</div>
            <div class="tool-box">
                <button class="map-action-btn" onclick="sendTroops()">⚔️ Направить дивизии</button>
                <button class="map-action-btn" onclick="buildForts()">🛡️ Построить укрепления</button>
                <button class="map-action-btn" onclick="industrialize()">🏭 Развернуть заводы</button>
            </div>
        </div>

        <!-- ЦЕНТР: БЕСКОНЕЧНАЯ ПЕРЕМЕЩАЕМАЯ КАРТА -->
        <div class="map-viewport" id="viewport">
            <div class="infinite-wrapper" id="panzoom-target">

                <!-- Основная карта -->
                <div class="map-clone" id="primary-map-container">
                    <!-- Убедись, что viewBox соответствует максимальным координатам твоих полигонов -->

                </div>

                <!-- Клон для бесшовного зацикливания справа -->
                <div class="map-clone" id="secondary-map-container"></div>
            </div>
        </div>

        <!-- ПРАВАЯ ПАНЕЛЬ -->
        <div class="log-sidebar">
            <div class="panel-title">Хроника Событий</div>
            <div class="ticker-box" id="log-ticker">
                [00:00] Фронтовой штаб развернут.<br>
            </div>
        </div>
    </div>

    
    <script>
        // Твои ID файлов из Google Drive
        const SVG_FILE_ID = '1V45IGIsIPLUPVSLTTvkBVOE5kSg4CRij';
        const JSON_FILE_ID = '1JqYSF0FcqHYre6vyotMREQVGB0ZsqA8c';

        // Используем прокси для обхода блокировок (CORS)
        const proxy = "https://corsproxy.io/?";

        const MAP_URL = `${proxy}https://drive.google.com/uc?export=download&id=${SVG_FILE_ID}`;
        const DB_URL = `${proxy}https://drive.google.com/uc?export=download&id=${JSON_FILE_ID}`;

        async function initGame() {
            try {
                const myCountry = localStorage.getItem('selectedHoiCountry') || 'СССР';
                const myColor = localStorage.getItem('selectedHoiColor') || '#cc0000';

                // 1. Загружаем данные из Google Drive через прокси
                const [dbResponse, svgResponse] = await Promise.all([
                    fetch(DB_URL),
                    fetch(MAP_URL)
                ]);

                if (!dbResponse.ok || !svgResponse.ok) throw new Error("Ошибка доступа к Google Drive");

                const dbData = await dbResponse.json();
                const svgText = await svgResponse.text();

                // 2. Вставляем карту в контейнер
                const container = document.getElementById('primary-map-container');
                container.innerHTML = svgText;

                // 3. Логика раскраски (остается прежней)
                const provinceLookup = {};
                dbData.forEach(item => provinceLookup[item.id] = item);

                const provinces = container.querySelectorAll('.province');
                provinces.forEach(prov => {
                    const data = provinceLookup[prov.id];
                    if (data) {
                        prov.style.fill = data.color;
                        prov.setAttribute('data-name', data.name);
                        prov.setAttribute('data-country', data.country);
                    }

                    prov.onclick = (e) => {
                        e.stopPropagation();
                        const name = prov.getAttribute('data-name');
                        const country = prov.getAttribute('data-country');
                        document.getElementById('selected-region-name').innerText = name;
                        document.getElementById('selected-region-status').innerHTML = `Владелец: <b>${country}</b>`;
                    };
                });

                // Настройка Panzoom
                setupPanzoom();
                console.log("Карта успешно загружена с Google Drive");

            } catch (err) {
                console.error("Критическая ошибка:", err);
                alert("Браузер блокирует запрос к Google Drive. Попробуйте отключить 'Улучшенную защиту от отслеживания' в настройках браузера или используйте Chrome/Opera.");
            }
        }

        function setupPanzoom() {
            const target = document.getElementById('panzoom-target');
            // Используем глобальный объект Panzoom из библиотеки cdnjs
            const pz = Panzoom(target, { maxScale: 5, minScale: 0.2 });
            document.getElementById('viewport').addEventListener('wheel', pz.zoomWithWheel);
        }

        initGame();
    </script>
</body>

</html>
