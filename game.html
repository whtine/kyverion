<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hearts of History: 1939</title>
    <style>
        /* Стиль в духе HOI4: темная сталь, золото и милитари */
        body {
            margin: 0;
            padding: 0;
            background: #121516 url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1924&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #d1c2a5;
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 12, 13, 0.85);
            z-index: 0;
        }

        .screen {
            position: relative;
            z-index: 1;
            display: none;
            flex-direction: column;
            align-items: center;
            width: 950px;
            height: 600px;
            background: #1c2022;
            border: 3px solid #3a4145;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8), 0 10px 30px rgba(0, 0, 0, 0.9);
            padding: 25px;
            box-sizing: border-box;
        }

        .screen.active {
            display: flex;
        }

        h1, h2, h3 {
            color: #e9c46a;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 3px;
            margin-top: 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            border-bottom: 2px solid #3a4145;
            padding-bottom: 10px;
            width: 100%;
        }

        .btn {
            width: 280px;
            padding: 14px;
            margin: 8px;
            background: linear-gradient(to bottom, #2c3235, #1e2224);
            border: 2px solid #4f585d;
            color: #d1c2a5;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
            transition: all 0.15s ease-in-out;
        }

        .btn:hover {
            background: linear-gradient(to bottom, #3a4246, #282d30);
            border-color: #e9c46a;
            color: #fff;
            box-shadow: 0 0 10px rgba(233, 196, 106, 0.4);
        }

        .hoi-layout {
            display: flex;
            width: 100%;
            height: 100%;
            margin-top: 15px;
            gap: 20px;
            overflow: hidden;
        }

        .countries-sidebar {
            width: 35%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            padding-right: 5px;
            border-right: 1px solid #3a4145;
        }

        .countries-sidebar::-webkit-scrollbar { width: 6px; }
        .countries-sidebar::-webkit-scrollbar-track { background: #1c2022; }
        .countries-sidebar::-webkit-scrollbar-thumb { background: #3a4145; border-radius: 3px; }

        .country-select-btn {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #24292c;
            border: 1px solid #3a4145;
            color: #d1c2a5;
            cursor: pointer;
            text-align: left;
            font-size: 15px;
            transition: 0.2s;
        }

        .country-select-btn:hover, .country-select-btn.active-country {
            background: #2e3539;
            border-color: #e9c46a;
            color: #fff;
        }

        .info-display {
            width: 65%;
            background: #181b1d;
            border: 1px solid #3a4145;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            height: 100%;
        }

        .country-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .ruler-title {
            font-style: italic;
            color: #a89a7e;
            margin-bottom: 15px;
            font-size: 15px;
        }

        .history-text {
            font-size: 14px;
            line-height: 1.6;
            color: #b5c2c7;
            text-align: justify;
            background: #131517;
            padding: 12px;
            border-left: 3px solid #e9c46a;
            height: 200px;
            overflow-y: auto;
        }

        .empty-prompt {
            text-align: center;
            color: #5a6368;
            font-size: 18px;
            margin-top: 100px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: auto;
        }

        .error-msg {
            color: #ff6b6b;
            padding: 15px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div id="main-menu" class="screen active">
        <h1>Hearts of History</h1>
        <div style="margin: auto 0; display: flex; flex-direction: column;">
            <button class="btn" onclick="switchScreen('singleplayer-menu')">Одиночная игра</button>
            <button class="btn" onclick="switchScreen('multiplayer-menu')">Сетевая игра</button>
            <button class="btn" onclick="switchScreen('settings-menu')">Настройки</button>
        </div>
    </div>

    <div id="singleplayer-menu" class="screen">
        <h2>Одиночная Игра</h2>
        <div style="margin: auto 0; display: flex; flex-direction: column;">
            <button class="btn">Продолжить</button>
            <button class="btn" onclick="switchScreen('country-select-menu')">Новая игра</button>
            <button class="btn">Загрузить игру</button>
            <button class="btn">Обучение</button>
            <button class="btn" onclick="switchScreen('main-menu')">Назад</button>
        </div>
    </div>

    <div id="country-select-menu" class="screen">
        <h2>Близость бури (1939)</h2>
        <div class="hoi-layout">
            <div class="countries-sidebar" id="sidebar-list">
                <p style="padding: 20px; text-align: center;">Загрузка штабов...</p>
            </div>

            <div class="info-display">
                <div id="prompt-text" class="empty-prompt">Выберите державу для просмотра разведданных штаба</div>

                <div id="details-block" style="display: none;">
                    <div class="country-header">
                        <div id="big-flag-placeholder"></div>
                        <h3 id="view-name" style="text-align: left; border: none; padding: 0; margin: 0;">Название</h3>
                    </div>
                    <div id="view-ruler" class="ruler-title">Статус: Готовность к мобилизации</div>
                    <div id="view-desc" class="history-text"></div>
                </div>

                <div class="action-buttons">
                    <button class="btn" style="width: 50%;" onclick="switchScreen('singleplayer-menu')">Назад</button>
                    <button id="hoi-start-btn" class="btn" style="width: 50%; border-color: #4caf50; display: none;"
                        onclick="redirectToMap()">Начать сценарий</button>
                </div>
            </div>
        </div>
    </div>

    <div id="multiplayer-menu" class="screen">
        <h2>Сетевая игра</h2>
        <div style="margin: auto; color: #5a6368;">[ ОЖИДАНИЕ ПОДКЛЮЧЕНИЯ К СЕРВЕРУ ]</div>
        <button class="btn" onclick="switchScreen('main-menu')">Назад</button>
    </div>

    <div id="settings-menu" class="screen">
        <h2>Настройки</h2>
        <div style="margin: auto; color: #5a6368;">[ ГРАФИКА / ЗВУК / ИНТЕРФЕЙС ]</div>
        <button class="btn" onclick="switchScreen('main-menu')">Назад</button>
    </div>

    <script>
        // Стабильная ссылка на твой Gist (без привязки к версии)
        const JSON_URL = 'https://gist.githubusercontent.com/whtine/3995ac119298d0b2fa1c9907f50e853b/raw/gistfile1.txt';

        async function loadCountriesFromDB() {
            const sidebar = document.getElementById('sidebar-list');
            sidebar.innerHTML = '<p style="padding: 20px; text-align: center;">Загрузка штабов...</p>';

            try {
                // Добавляем timestamp, чтобы браузер не кэшировал старые данные
                const response = await fetch(`${JSON_URL}?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error("Не удалось загрузить данные из облака");

                const dbData = await response.json();

                const countriesMap = {};
                dbData.forEach(item => {
                    if (item.country && !countriesMap[item.country]) {
                        countriesMap[item.country] = {
                            name: item.country,
                            color: item.color || '#cccccc'
                        };
                    }
                });

                sidebar.innerHTML = ''; 

                const sortedCountries = Object.values(countriesMap).sort((a, b) => a.name.localeCompare(b.name));

                if (sortedCountries.length === 0) {
                    sidebar.innerHTML = '<p style="padding: 20px;">Страны не найдены.</p>';
                    return;
                }

                sortedCountries.forEach(country => {
                    const btn = document.createElement('button');
                    btn.className = 'country-select-btn';
                    btn.style.borderLeft = `8px solid ${country.color}`;

                    btn.innerHTML = `
                        <div style="width:30px; height:20px; background:${country.color}; margin-right:15px; border:1px solid #000"></div>
                        <span>${country.name}</span>
                    `;

                    btn.onclick = () => {
                        document.querySelectorAll('.country-select-btn').forEach(b => b.classList.remove('active-country'));
                        btn.classList.add('active-country');

                        localStorage.setItem('selectedHoiCountry', country.name);
                        localStorage.setItem('selectedHoiColor', country.color);

                        showDetails(country);
                    };
                    sidebar.appendChild(btn);
                });

                console.log("Данные успешно синхронизированы");

            } catch (e) {
                console.error("Ошибка загрузки:", e);
                sidebar.innerHTML = `
                <div class="error-msg">
                    <b>Ошибка связи!</b><br>
                    Не удалось получить данные из Gist.<br>
                    <small>${e.message}</small>
                </div>`;
            }
        }

        function showDetails(country) {
            document.getElementById('prompt-text').style.display = 'none';
            const details = document.getElementById('details-block');
            const startBtn = document.getElementById('hoi-start-btn');

            details.style.display = 'block';
            startBtn.style.display = 'block';

            document.getElementById('view-name').innerText = country.name;
            document.getElementById('view-desc').innerText =
                `Штаб державы ${country.name} подтвердил получение данных. \n\nВсе провинции сектора будут окрашены в ваш национальный цвет (${country.color}). Сценарий "Близость бури" готов к инициализации.`;

            document.getElementById('big-flag-placeholder').innerHTML =
                `<div style="width:90px; height:55px; background:${country.color}; border:2px solid #e9c46a; box-shadow: 0 4px 8px rgba(0,0,0,0.6)"></div>`;
        }

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');

            if (screenId === 'country-select-menu') {
                loadCountriesFromDB();
            }
        }

        function redirectToMap() {
            window.location.href = 'map.html';
        }

        window.onload = () => {
            if (document.getElementById('country-select-menu').classList.contains('active')) {
                loadCountriesFromDB();
            }
        };
    </script>
</body>

</html>
