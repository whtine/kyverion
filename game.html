<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hearts of History: 1939</title>

    <style>
        /* Стиль в духе HOI4: темная сталь, золото и милитари */
        body {
            margin: 0;
            padding: 0;
            background: #121516 url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1924&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #d1c2a5;
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 12, 13, 0.85);
            z-index: 0;
        }

        .screen {
            position: relative;
            z-index: 1;
            display: none;
            flex-direction: column;
            align-items: center;
            width: 950px;
            height: 600px;
            background: #1c2022;
            border: 3px solid #3a4145;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8), 0 10px 30px rgba(0, 0, 0, 0.9);
            padding: 25px;
            box-sizing: border-box;
        }

        .screen.active {
            display: flex;
        }

        h1, h2, h3 {
            color: #e9c46a;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 3px;
            margin-top: 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            border-bottom: 2px solid #3a4145;
            padding-bottom: 10px;
            width: 100%;
        }

        .btn {
            width: 280px;
            padding: 14px;
            margin: 8px;
            background: linear-gradient(to bottom, #2c3235, #1e2224);
            border: 2px solid #4f585d;
            color: #d1c2a5;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
            transition: all 0.15s ease-in-out;
        }

        .btn:hover {
            background: linear-gradient(to bottom, #3a4246, #282d30);
            border-color: #e9c46a;
            color: #fff;
            box-shadow: 0 0 10px rgba(233, 196, 106, 0.4);
        }

        .hoi-layout {
            display: flex;
            width: 100%;
            height: 100%;
            margin-top: 15px;
            gap: 20px;
            overflow: hidden;
        }

        .countries-sidebar {
            width: 35%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            padding-right: 5px;
            border-right: 1px solid #3a4145;
        }

        .countries-sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .countries-sidebar::-webkit-scrollbar-track {
            background: #1c2022;
        }

        .countries-sidebar::-webkit-scrollbar-thumb {
            background: #3a4145;
            border-radius: 3px;
        }

        .country-select-btn {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #24292c;
            border: 1px solid #3a4145;
            color: #d1c2a5;
            cursor: pointer;
            text-align: left;
            font-size: 15px;
            transition: 0.2s;
        }

        .country-select-btn:hover,
        .country-select-btn.active-country {
            background: #2e3539;
            border-color: #e9c46a;
            color: #fff;
        }

        .info-display {
            width: 65%;
            background: #181b1d;
            border: 1px solid #3a4145;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            height: 100%;
        }

        .country-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .ruler-title {
            font-style: italic;
            color: #a89a7e;
            margin-bottom: 15px;
            font-size: 15px;
        }

        .history-text {
            font-size: 14px;
            line-height: 1.6;
            color: #b5c2c7;
            text-align: justify;
            background: #131517;
            padding: 12px;
            border-left: 3px solid #e9c46a;
            height: 200px;
            overflow-y: auto;
        }

        .empty-prompt {
            text-align: center;
            color: #5a6368;
            font-size: 18px;
            margin-top: 100px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: auto;
        }

        .error-msg {
            color: #ff6b6b;
            padding: 15px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div id="main-menu" class="screen active">
        <h1>Hearts of History</h1>
        <div style="margin: auto 0; display: flex; flex-direction: column;">
            <button class="btn" onclick="switchScreen('singleplayer-menu')">Одиночная игра</button>
            <button class="btn" onclick="switchScreen('multiplayer-menu')">Сетевая игра</button>
            <button class="btn" onclick="switchScreen('settings-menu')">Настройки</button>
        </div>
    </div>

    <div id="singleplayer-menu" class="screen">
        <h2>Одиночная Игра</h2>
        <div style="margin: auto 0; display: flex; flex-direction: column;">
            <button class="btn">Продолжить</button>
            <button class="btn" onclick="switchScreen('country-select-menu')">Новая игра</button>
            <button class="btn">Загрузить игру</button>
            <button class="btn">Обучение</button>
            <button class="btn" onclick="switchScreen('main-menu')">Назад</button>
        </div>
    </div>

    <div id="country-select-menu" class="screen">
        <h2>Близость бури (1939)</h2>
        <div class="hoi-layout">
            <div class="countries-sidebar" id="sidebar-list">
                <p style="padding: 20px; text-align: center;">Загрузка штабов...</p>
            </div>

            <div class="info-display">
                <div id="prompt-text" class="empty-prompt">Выберите державу для просмотра разведданных штаба</div>

                <div id="details-block" style="display: none;">
                    <div class="country-header">
                        <div id="big-flag-placeholder"></div>
                        <h3 id="view-name" style="text-align: left; border: none; padding: 0; margin: 0; display: flex; align-items: center;">Название</h3>
                    </div>
                    <div id="view-ruler" class="ruler-title">Статус: Готовность к мобилизации</div>
                    <div id="view-desc" class="history-text"></div>
                </div>

                <div class="action-buttons">
                    <button class="btn" style="width: 50%;" onclick="switchScreen('singleplayer-menu')">Назад</button>
                    <button id="hoi-start-btn" class="btn" style="width: 50%; border-color: #4caf50; display: none;" onclick="redirectToMap()">Начать сценарий</button>
                </div>
            </div>
        </div>
    </div>

    <div id="multiplayer-menu" class="screen">
        <h2>Сетевая игра</h2>
        <div style="margin: auto; color: #5a6368;">[ ОЖИДАНИЕ ПОДКЛЮЧЕНИЯ К СЕРВЕРУ ]</div>
        <button class="btn" onclick="switchScreen('main-menu')">Назад</button>
    </div>

    <div id="settings-menu" class="screen">
        <h2>Настройки</h2>
        <div style="margin: auto; color: #5a6368;">[ ГРАФИКА / ЗВУК / ИНТЕРФЕЙС ]</div>
        <button class="btn" onclick="switchScreen('main-menu')">Назад</button>
    </div>

    <script>
        const FLAGS_DB_URL = 'https://gist.githubusercontent.com/whtine/8e3411c633b06ef24e23cbfea0a1818f/raw/eb69432c140b1e2b649a90363df46c08fcb2e6a0/gistfile1.txt';
        const PROVINCES_DB_URL = 'https://gist.githubusercontent.com/whtine/3995ac119298d0b2fa1c9907f50e853b/raw/f3e9f1dd9a5ba6b9c5b314eae3ba96125acfa151/gistfile1.txt';

        let countriesFlags = {};
        let provincesData = [];

        // Таблица перевода тегов из базы провинций в точные названия вашей базы флагов
        const tagToRussianName = {
            'sov': 'СССР', 'ger': 'Третий Рейх', 'yug': 'Югославия', 'tib': 'Тибет', 'slv': 'Словакия',
            'man': 'Маньчжоу-го', 'usa': 'США', 'eng': 'Великобритания', 'fra': 'Франция', 'ita': 'Италия',
            'jap': 'Япония', 'pol': 'Польша', 'fin': 'Финляндия', 'rom': 'Румыния', 'hun': 'Венгрия',
            'bul': 'Болгария', 'cze': 'Чехословакия', 'sia': 'Сиам', 'hol': 'Нидерланды', 'ins': 'Нидерл.Индия',
            'ast': 'Австралия', 'arg': 'Аргентина', 'afg': 'Афганистан', 'bel': 'Бельгия', 'bol': 'Боливия',
            'bra': 'Бразилия', 'btn': 'Бутан', 'ven': 'Венесуэла', 'gmt': 'Гватемала', 'hon': 'Гондурас',
            'gre': 'Греция', 'den': 'Дания', 'dom': 'Доминикана', 'yem': 'Йемен', 'est': 'Эстония',
            'irq': 'Ирак', 'per': 'Иран', 'ice': 'Исландия', 'spr': 'Испания', 'can': 'Канада',
            'chi': 'Китай', 'col': 'Колумбия', 'cos': 'Коста Рика', 'cub': 'Куба', 'lat': 'Латвия',
            'lit': 'Литва', 'lux': 'Люксембург', 'mex': 'Мексика', 'nep': 'Непал', 'nic': 'Никарагуа',
            'nzl': 'Новая Зеландия', 'nor': 'Норвегия', 'pan': 'Панама', 'pru': 'Перу', 'por': 'Португалия',
            'sal': 'Сальвадор', 'sau': 'Саудовская Аравия', 'tur': 'Турция', 'ury': 'Уругвай',
            'chm': 'Чили', 'swi': 'Швейцария', 'swe': 'Швеция', 'ecu': 'Эквадор', 'saf': 'ЮАР', 'jam': 'Ямайка'
        };

        function getHistoricalFlagUrl(countryName) {
            if (!countryName) return 'https://flagcdn.com/w80/un.png';
            const name = countryName.trim().toLowerCase();

            const historicalDB = {
                'ссср': 'https://i.postimg.cc/tC1SqWWn/Flag-of-the-Soviet-Union.jpg',
                'третий рейх': 'https://i.postimg.cc/vBf8wchJ/Flag-of-Germany-(1935-1945).jpg',
                'югославия': 'https://i.postimg.cc/zf336z4s/Flag-of-Yugoslavia-(1918-1941).jpg',
                'маньчжоу-го': 'https://i.postimg.cc/wM4GWkJT/Flag-of-Manchukuo.jpg',
                'тибет': 'https://i.postimg.cc/MZYx0kFy/Flag-of-Tibet.jpg',
                'нидерл.индия': 'https://flagcdn.com/w80/id.png',
                'сиам': 'https://flagcdn.com/w80/th.png',
                'великобритания': 'https://flagcdn.com/w80/gb.png',
                'сша': 'https://flagcdn.com/w80/us.png',
                'франция': 'https://flagcdn.com/w80/fr.png',
                'италия': 'https://flagcdn.com/w80/it.png',
                'япония': 'https://flagcdn.com/w80/jp.png',
                'испания': 'https://flagcdn.com/w80/es.png',
                'чехословакия': 'https://flagcdn.com/w80/cz.png'
            };

            if (historicalDB[name]) return historicalDB[name];

            const localCodes = {
                'австралия': 'au', 'аргентина': 'ar', 'афганистан': 'af', 'белиз': 'bz', 'бельгия': 'be',
                'болгария': 'bg', 'боливия': 'bo', 'бразилия': 'br', 'бутан': 'bt', 'венгрия': 'hu',
                'венесуэла': 've', 'гватемала': 'gt', 'гондурас': 'hn', 'греция': 'gr', 'дания': 'dk',
                'доминикана': 'do', 'йемен': 'ye', 'эстония': 'ee', 'ирак': 'iq', 'иран': 'ir',
                'исландия': 'is', 'канада': 'ca', 'китай': 'cn', 'колумбия': 'co', 'коста рика': 'cr',
                'куба': 'cu', 'латвия': 'lv', 'литва': 'lt', 'люксембург': 'lu', 'мексика': 'mx',
                'непал': 'np', 'нидерланды': 'nl', 'никарагуа': 'ni', 'новая зеландия': 'nz', 'норвегия': 'no',
                'панама': 'pa', 'перу': 'pe', 'польша': 'pl', 'португалия': 'pt', 'румыния': 'ro',
                'сальвадор': 'sv', 'саудовская аравия': 'sa', 'словакия': 'sk', 'турция': 'tr', 'уругвай': 'uy',
                'финляндия': 'fi', 'чили': 'cl', 'швейцария': 'ch', 'швеция': 'se', 'эквадор': 'ec',
                'юар': 'za', 'ямайка': 'jm'
            };

            return localCodes[name] ? `https://flagcdn.com/w80/${localCodes[name]}.png` : 'https://flagcdn.com/w80/un.png';
        }

        async function loadCountriesFromDB() {
            const sidebar = document.getElementById('sidebar-list');
            sidebar.innerHTML = '<p style="padding: 20px; text-align: center;">Загрузка штабов...</p>';

            try {
                const timestamp = new Date().getTime();
                const [flagsRes, provincesRes] = await Promise.all([
                    fetch(`${FLAGS_DB_URL}?t=${timestamp}`),
                    fetch(`${PROVINCES_DB_URL}?t=${timestamp}`)
                ]);

                const flagsData = await flagsRes.json();
                provincesData = await provincesRes.json();

                // 1. Заполняем реестр флагов, переводя ключи в нижний регистр для стабильности
                countriesFlags = {};
                flagsData.forEach(item => {
                    if (item.country) {
                        countriesFlags[item.country.trim().toLowerCase()] = { 
                            id: item.id || "0", 
                            color: item.color || '#cccccc' 
                        };
                    }
                });

                const uniqueCountries = {};

                // 2. Обрабатываем провинции
                provincesData.forEach(item => {
                    let searchName = "";
                    
                    // Если поле country содержит английский тег (например SOV), переводим его в "СССР"
                    if (item.country && tagToRussianName[item.country.trim().toLowerCase()]) {
                        searchName = tagToRussianName[item.country.trim().toLowerCase()];
                    } else if (item.tag && tagToRussianName[item.tag.trim().toLowerCase()]) {
                        searchName = tagToRussianName[item.tag.trim().toLowerCase()];
                    } else if (item.country) {
                        searchName = item.country.trim();
                    }

                    if (searchName) {
                        const key = searchName.toLowerCase();
                        
                        // СТРОГАЯ ПРОВЕРКА: Если страны нет в твоей базе флагов — ИГНОРИРУЕМ ЕЁ
                        if (countriesFlags[key]) {
                            if (!uniqueCountries[searchName]) {
                                const info = countriesFlags[key];
                                const imgUrl = getHistoricalFlagUrl(searchName);

                                uniqueCountries[searchName] = {
                                    id: info.id,
                                    name: searchName,
                                    flagUrl: imgUrl,
                                    color: info.color
                                };
                            }
                        }
                    }
                });

                const sortedList = Object.values(uniqueCountries).sort((a, b) => a.name.localeCompare(b.name));
                sidebar.innerHTML = '';

                if (sortedList.length === 0) {
                    sidebar.innerHTML = '<p style="padding: 20px; text-align: center; color: #5a6368;">Нет доступных стран</p>';
                    return;
                }

                sortedList.forEach(country => {
                    const btn = document.createElement('button');
                    btn.className = 'country-select-btn';
                    btn.style.borderLeft = `8px solid ${country.color}`;

                    btn.innerHTML = `
                        <div style="width:35px; height:22px; margin-right:15px; border:1px solid #000; display:flex; overflow:hidden; background:#2c3235;">
                            <img src="${country.flagUrl}" style="width:100%; height:100%; object-fit:cover;" onerror="this.src='https://flagcdn.com/w80/un.png'">
                        </div>
                        <span>${country.name}</span>
                    `;

                    btn.onclick = () => {
                        document.querySelectorAll('.country-select-btn').forEach(b => b.classList.remove('active-country'));
                        btn.classList.add('active-country');
                        localStorage.setItem('selectedHoiCountry', country.name);
                        localStorage.setItem('selectedHoiColor', country.color);
                        localStorage.setItem('selectedHoiFlagUrl', country.flagUrl);
                        localStorage.setItem('selectedHoiId', country.id);
                        showDetails(country);
                    };
                    sidebar.appendChild(btn);
                });
            } catch (e) {
                sidebar.innerHTML = `<div class="error-msg">Ошибка сценария: ${e.message}</div>`;
            }
        }

        function showDetails(country) {
            document.getElementById('prompt-text').style.display = 'none';
            const details = document.getElementById('details-block');
            const startBtn = document.getElementById('hoi-start-btn');

            details.style.display = 'block';
            startBtn.style.display = 'block';

            document.getElementById('view-name').innerHTML = `
                <img src="${country.flagUrl}" style="height:22px; width:35px; object-fit:cover; vertical-align:middle; margin-right:12px; border:1px solid #3a4145;" onerror="this.src='https://flagcdn.com/w80/un.png'"> 
                ${country.name} <span style="font-size: 13px; color: #a89a7e; margin-left: 10px;">[ID: ${country.id}]</span>
            `;

            document.getElementById('big-flag-placeholder').innerHTML = `
                <div style="width:90px; height:55px; background:${country.color}; border:2px solid #e9c46a; display:flex; align-items:center; justify-content:center; overflow:hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.6);">
                    <img src="${country.flagUrl}" style="width:100%; height:100%; object-fit:cover;" onerror="this.src='https://flagcdn.com/w80/un.png'">
                </div>
            `;

            document.getElementById('view-desc').innerHTML =
                `Разведданные по державе ${country.name} загружены. <br>Идентификатор реестра: <b>${country.id}</b>.<br>Цвет фракции на стратегической карте: <span style="color:${country.color}; font-weight:bold;">${country.color}</span>.<br><br>Генеральный штаб завершил стратегическое планирование. Все дивизии ожидают приказа о развертывании на границах.`;
        }

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            if (screenId === 'country-select-menu') loadCountriesFromDB();
        }

        function redirectToMap() {
            localStorage.setItem('hoiProvincesDB', JSON.stringify(provincesData));
            localStorage.setItem('hoiFlagsDB', JSON.stringify(countriesFlags));
            window.location.href = 'map.html';
        }
    </script>
</body>

</html>
